services:
  # FastAPI Application
  api:
    build: .
    container_name: lifeos-api
    ports:
      - "8000:8000"
    environment:
      # Application
      - APP_NAME=LifeOS
      - APP_VERSION=0.1.0
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=INFO

      # Server
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=1

      # Security
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-this-in-production}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7

      # MongoDB - Override to use host machine
      - MONGODB_URL=mongodb://host.docker.internal:27017
      - MONGODB_DB_NAME=lifeos
      - MONGODB_MIN_POOL_SIZE=10
      - MONGODB_MAX_POOL_SIZE=50

      # Redis - Use Docker container
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=false

      # OpenAI
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your-openai-api-key}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5-nano}
      - OPENAI_EMBEDDING_MODEL=text-embedding-3-small
      - OPENAI_MAX_TOKENS=4096
      - OPENAI_TEMPERATURE=0.7

      # Google OAuth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-your-google-client-id}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-your-google-client-secret}
      - GOOGLE_REDIRECT_URI=http://localhost:8000/api/v1/integrations/google/callback

      # Microsoft OAuth
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-your-microsoft-client-id}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-your-microsoft-client-secret}
      - MICROSOFT_REDIRECT_URI=http://localhost:8000/api/v1/integrations/microsoft/callback
      - MICROSOFT_TENANT_ID=common

      # AgentMail
      - AGENTMAIL_API_KEY=${AGENTMAIL_API_KEY:-your-agentmail-api-key}
      - AGENTMAIL_WEBHOOK_SECRET=${AGENTMAIL_WEBHOOK_SECRET:-your-webhook-secret}

      # Background Jobs
      - ENABLE_SCHEDULER=true
      - EMAIL_SYNC_INTERVAL_MINUTES=15
      - CALENDAR_SYNC_INTERVAL_MINUTES=30
      - REMINDER_CHECK_INTERVAL_MINUTES=5

      # CORS
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - CORS_ALLOW_CREDENTIALS=true

      # Rate Limiting
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_PER_MINUTE=60
    volumes:
      - .:/app
    depends_on:
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - lifeos-network
    # Uncomment the next 2 lines if you're on Linux
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

  # Redis (Cache)
  redis:
    image: redis:7-alpine
    container_name: lifeos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lifeos-network

volumes:
  redis_data:

networks:
  lifeos-network:
    driver: bridge
