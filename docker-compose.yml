services:
  # FastAPI Application
  api:
    build: .
    container_name: lifeos-api
    ports:
      - "8000:8000"
    environment:
      # Use host.docker.internal to connect to host's MongoDB/Redis on Mac/Windows
      # For Linux, use: extra_hosts: - "host.docker.internal:host-gateway"
      - MONGODB_URL=${MONGODB_URL:-mongodb://host.docker.internal:27017}
      - REDIS_URL=${REDIS_URL:-redis://host.docker.internal:6379/0}
    env_file:
      - .env
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # Uncomment the next 2 lines if you're on Linux
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
